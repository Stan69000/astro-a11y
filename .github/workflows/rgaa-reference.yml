name: RGAA reference

# The RGAA reference (criteria titles, version) is shared with rgaa-audit:
# packages/core/src/rgaa-criteria.cjs must stay identical to its
# extension/shared/rgaa-criteria.js. A drift is reported weekly instead of
# breaking unrelated pull requests.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - packages/core/src/rgaa-criteria.cjs
      - scripts/sync-rgaa-reference.js

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/sync-rgaa-reference.js --check
