name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  e2e:
    # Real-browser tests (keyboard checks).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node packages/cli/dist/bin.js install-browser --with-deps
      - run: pnpm test:e2e

  action:
    # Runs the repository's own GitHub Action on the example fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict scan with the committed baseline (must pass)
        id: with-baseline
        uses: ./
        with:
          target: examples/static-site/site
          mode: strict
          baseline: examples/static-site/a11y-baseline.json
          artifact-name: astro-a11y-self-test
      - name: Strict scan without baseline (must fail)
        id: without-baseline
        continue-on-error: true
        uses: ./
        with:
          target: examples/static-site/site
          mode: strict
          comment: 'false'
          upload-report: 'false'
      - name: Check outcomes
        env:
          NEW_WITH_BASELINE: ${{ steps.with-baseline.outputs.new-issues }}
          OUTCOME_WITHOUT_BASELINE: ${{ steps.without-baseline.outcome }}
        run: |
          test "$NEW_WITH_BASELINE" = "0"
          test "$OUTCOME_WITHOUT_BASELINE" = "failure"
